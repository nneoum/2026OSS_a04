<!DOCTYPE html>
<html lang="ko">
 
<head>
    <meta charset="UTF-8">
    <title>form1_css</title>
    <!-- Clone Coding 원본 URL: https://www.kurly.com/member/signup?internalUrl=%2Fmain -->
    <style>
        * {
            box-sizing: border-box;
        }
 
        body {
            background-color: #ffffff;
            color: #222222;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
 
        form {
            width: 100%;
            max-width: 640px;
        }
 
        h2 {
            text-align: center;
            font-size: 26px;
            margin: 0 0 24px 0;
        }
 
        fieldset {
            border: none;
            border-top: 1px solid #222222;
            padding: 20px 0;
            margin: 0;
        }
 
        legend {
            text-align: right;
            font-size: 15px;
            font-weight: bold;
            padding: 0;
            margin-bottom: 8px;
            width: 100%;
        }
 
        legend.align-left {
            text-align: left;
        }
 
        .row {
            display: flex;
            align-items: flex-start;
            padding: 12px 0;
            gap: 20px;
        }
 
        .row label {
            width: 130px;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: bold;
            padding-top: 10px;
        }
 
        .row-content {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: center;
        }
 
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            background-color: #ffffff;
            color: #222222;
        }
 
        textarea {
            resize: vertical;
            font-family: inherit;
        }
 
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #5f0080;
        }
 
        input::placeholder,
        textarea::placeholder {
            color: #b3b3b3;
        }
 
        .radio-group {
            display: flex;
            align-items: center;
            font-size: 14px;
            gap: 4px;
        }
 
        .radio-group label {
            font-weight: normal;
            width: auto;
            padding: 0;
            margin-right: 24px;
            cursor: pointer;
        }
 
        .sub-checks {
            display: flex;
            gap: 20px;
            margin-left: 28px;
            padding-bottom: 10px;
        }
 
        button[type="button"] {
            padding: 10px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background-color: #ffffff;
            color: #222222;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
 
        button[type="button"]:hover {
            border-color: #5f0080;
            color: #5f0080;
        }
 
        input[type="submit"] {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 4px;
            background-color: #5f0080;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
 
        input[type="submit"]:hover {
            background-color: #4a0066;
        }
    </style>
</head>
 
<body>
 
    <form id="userForm" method="post" action="/action_page.php">
        <h2>회원가입</h2>
 
        <fieldset>
            <legend>* 필수입력사항</legend>
 
            <div class="row">
                <label for="userid">아이디*</label>
                <div class="row-content">
                    <input type="text" id="userid" name="userid" placeholder="아이디를 입력해주세요" required>
                </div>
            </div>
 
            <div class="row">
                <label for="password">비밀번호*</label>
                <div class="row-content">
                    <input type="password" id="password" name="password" minlength="6" required>
                </div>
            </div>
 
            <div class="row">
                <label for="passwordConfirm">비밀번호확인*</label>
                <div class="row-content">
                    <input type="password" id="passwordConfirm" name="passwordConfirm" minlength="6" required>
                </div>
            </div>
 
            <div class="row">
                <label for="username">이름*</label>
                <div class="row-content">
                    <input type="text" id="username" name="username" placeholder="이름을 입력해 주세요" required>
                </div>
            </div>
 
            <div class="row">
                <label for="emailId">이메일*</label>
                <div class="row-content">
                    <input type="email" id="emailId" name="emailId" placeholder="예: marketkurly" required>
                    <span>@</span>
                    <select id="emailDomain" name="emailDomain">
                        <optgroup label="자주 쓰는 도메인">
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                            <option value="daum.net">daum.net</option>
                        </optgroup>
                        <optgroup label="기타">
                            <option value="direct">직접 입력</option>
                        </optgroup>
                    </select>
                </div>
            </div>
 
            <div class="row">
                <label for="phone">휴대폰*</label>
                <div class="row-content">
                    <input type="tel" id="phone" name="phone" placeholder="숫자만 입력해주세요.">
                    <button type="button">인증번호 받기</button>
                </div>
            </div>
 
            <div class="row">
                <label for="address">주소*</label>
                <div class="row-content">
                    <input type="text" id="address" name="address" list="cities" placeholder="주소를 입력해주세요">
                    <datalist id="cities">
                        <option value="서울">
                        <option value="부산">
                        <option value="포항">
                    </datalist>
                    <button type="button">주소 검색</button>
                </div>
            </div>
 
            <div class="row">
                <label for="addressDetail">상세주소</label>
                <div class="row-content">
                    <textarea id="addressDetail" name="addressDetail" rows="3" placeholder="상세주소를 입력해주세요"></textarea>
                </div>
            </div>
 
            <div class="row">
                <label for="birthdate">생년월일*</label>
                <div class="row-content">
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>
            </div>
 
            <div class="row">
                <label>성별*</label>
                <div class="row-content radio-group">
                    <input type="radio" id="genderMale" name="gender" value="MALE">
                    <label for="genderMale">남자</label>
 
                    <input type="radio" id="genderFemale" name="gender" value="FEMALE">
                    <label for="genderFemale">여자</label>
 
                    <input type="radio" id="genderNone" name="gender" value="NONE" checked>
                    <label for="genderNone">선택안함</label>
                </div>
            </div>
        </fieldset>
 
        <fieldset>
            <legend class="align-left">이용약관동의*</legend>
 
            <div class="check-item">
                <input type="checkbox" id="agreeAll" name="agreeAll">
                <label for="agreeAll">전체 동의합니다</label>
            </div>
 
            <div class="check-item">
                <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                <label for="agreeTerms">컬리 이용약관 동의 (필수)</label>
            </div>
 
            <div class="check-item">
                <input type="checkbox" id="agreePrivacy" name="agreePrivacy" required>
                <label for="agreePrivacy">개인정보 수집·이용 (필수)</label>
            </div>
 
            <div class="check-item">
                <input type="checkbox" id="agreeEvent" name="agreeEvent">
                <label for="agreeEvent">이벤트 및 혜택정보 발송을 위한 수집·이용 (선택)</label>
            </div>
 
            <div class="check-item">
                <input type="checkbox" id="agreeAd" name="agreeAd">
                <label for="agreeAd">광고성 정보 수신 (선택)</label>
            </div>
 
            <div class="sub-checks">
                <div class="check-item">
                    <input type="checkbox" id="agreeAdSms" name="agreeAdSms">
                    <label for="agreeAdSms">문자</label>
                </div>
                <div class="check-item">
                    <input type="checkbox" id="agreeAdEmail" name="agreeAdEmail">
                    <label for="agreeAdEmail">이메일</label>
                </div>
                <div class="check-item">
                    <input type="checkbox" id="agreeAdKakao" name="agreeAdKakao">
                    <label for="agreeAdKakao">카카오</label>
                </div>
            </div>
 
            <div class="check-item">
                <input type="checkbox" id="agreeAge" name="agreeAge" required>
                <label for="agreeAge">본인은 만 14세 이상입니다. (필수)</label>
            </div>
        </fieldset>
 
        <input type="submit" value="가입하기">
    </form>
 
</body>
 
</html>
